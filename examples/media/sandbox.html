<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Damped oscillation</title>
<style>
  /* A widget is a document of its own: it inherits none of the deck's type or
     colour, so it brings its own. Painting an opaque panel rather than leaving
     the frame transparent keeps it readable on a light slide and a dark one. */
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 2%;
    padding: 4% 5%; box-sizing: border-box;
    background: #141824; color: #e8ecf6;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  canvas { flex: 1; width: 100%; min-height: 0; }
  .row { display: flex; align-items: center; gap: 1em; font-size: clamp(11px, 2.4vw, 20px); }
  .row label { width: 7em; color: #9aa4bd; }
  .row output { width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: #7c6cf0; }
</style>
</head>
<body>
  <canvas id="plot"></canvas>
  <div class="row">
    <label for="freq">frequency</label>
    <input id="freq" type="range" min="1" max="12" step="0.1" value="4">
    <output id="freq-out">4.0</output>
  </div>
  <div class="row">
    <label for="damp">damping</label>
    <input id="damp" type="range" min="0" max="3" step="0.05" value="0.8">
    <output id="damp-out">0.80</output>
  </div>
<script>
  const plot = document.getElementById('plot');
  const ctx = plot.getContext('2d');
  const freq = document.getElementById('freq');
  const damp = document.getElementById('damp');

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = plot.clientWidth, h = plot.clientHeight;
    plot.width = w * dpr; plot.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = '#2c3450';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

    const f = +freq.value, d = +damp.value;
    document.getElementById('freq-out').textContent = f.toFixed(1);
    document.getElementById('damp-out').textContent = d.toFixed(2);

    ctx.strokeStyle = '#7c6cf0';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = 0; px <= w; px++) {
      const t = px / w;
      const y = h / 2 - Math.exp(-d * t * 3) * Math.sin(2 * Math.PI * f * t) * (h * 0.38);
      px ? ctx.lineTo(px, y) : ctx.moveTo(px, y);
    }
    ctx.stroke();
  }

  freq.addEventListener('input', draw);
  damp.addEventListener('input', draw);
  addEventListener('resize', draw);
  draw();
</script>
</body>
</html>
