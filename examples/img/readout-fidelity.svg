<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="'Noto Sans CJK JP', 'Hiragino Sans', sans-serif">
  <!-- 軸 -->
  <line x1="70" y1="340" x2="520" y2="340" stroke="#8b93ad" stroke-width="1.5"/>
  <line x1="70" y1="40"  x2="70"  y2="340" stroke="#8b93ad" stroke-width="1.5"/>
  <!-- グリッド + 目盛 -->
  <g stroke="#e8eaf2" stroke-width="1">
    <line x1="70" y1="90"  x2="520" y2="90"/>
    <line x1="70" y1="160" x2="520" y2="160"/>
    <line x1="70" y1="230" x2="520" y2="230"/>
    <line x1="70" y1="300" x2="520" y2="300"/>
  </g>
  <g font-size="13" fill="#6d7590" text-anchor="end">
    <text x="62" y="94">99.5</text>
    <text x="62" y="164">99.0</text>
    <text x="62" y="234">98.0</text>
    <text x="62" y="304">97.0</text>
  </g>
  <g font-size="13" fill="#6d7590" text-anchor="middle">
    <text x="120" y="360">200</text>
    <text x="230" y="360">400</text>
    <text x="340" y="360">600</text>
    <text x="450" y="360">800</text>
  </g>
  <text x="295" y="392" text-anchor="middle" font-size="14" fill="#23272f">積分時間 τ (ns)</text>
  <text x="24" y="190" text-anchor="middle" font-size="14" fill="#23272f" transform="rotate(-90 24 190)">読み出し忠実度 (%)</text>

  <!-- HEMT のみ(実線・グレー) -->
  <polyline points="90,332 120,318 175,296 230,278 285,266 340,258 395,254 450,252 505,254"
            fill="none" stroke="#9aa1b8" stroke-width="2.5"/>
  <!-- +JPA 実測(実線・アクセント) -->
  <polyline points="90,224 120,178 175,132 230,106 260,98 285,96 310,98 340,104 395,118 450,136 505,158"
            fill="none" stroke="#12b8a6" stroke-width="3"/>
  <!-- モデル(破線) -->
  <polyline points="90,232 120,184 175,136 230,108 260,100 285,97 310,99 340,106 395,121 450,140 505,162"
            fill="none" stroke="#3056d3" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- 誤差棒(JPA 系列の一部) -->
  <g stroke="#12b8a6" stroke-width="1.5">
    <line x1="175" y1="124" x2="175" y2="140"/><line x1="170" y1="124" x2="180" y2="124"/><line x1="170" y1="140" x2="180" y2="140"/>
    <line x1="285" y1="90"  x2="285" y2="102"/><line x1="280" y1="90"  x2="290" y2="90"/><line x1="280" y1="102" x2="290" y2="102"/>
    <line x1="450" y1="128" x2="450" y2="144"/><line x1="445" y1="128" x2="455" y2="128"/><line x1="445" y1="144" x2="455" y2="144"/>
  </g>
  <!-- 最適点マーカー(τ = 480 ns 付近) -->
  <circle id="opt" cx="285" cy="96" r="6" fill="#12b8a6" stroke="#fff" stroke-width="2"/>
  <line x1="285" y1="96" x2="285" y2="340" stroke="#12b8a6" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="285" y="80" text-anchor="middle" font-size="13" fill="#0d8a7d" font-weight="bold">τ* = 480 ns</text>

  <!-- 凡例 -->
  <g font-size="13">
    <line x1="330" y1="52" x2="362" y2="52" stroke="#12b8a6" stroke-width="3"/>
    <text x="368" y="56" fill="#23272f">+JPA(実測)</text>
    <line x1="330" y1="72" x2="362" y2="72" stroke="#3056d3" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="368" y="76" fill="#23272f">モデル</text>
    <line x1="330" y1="92" x2="362" y2="92" stroke="#9aa1b8" stroke-width="2.5"/>
    <text x="368" y="96" fill="#23272f">HEMT のみ</text>
  </g>
</svg>
