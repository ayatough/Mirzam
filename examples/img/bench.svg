<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" font-family="Helvetica, Arial, sans-serif">
  <text x="260" y="34" text-anchor="middle" font-size="20" fill="#23272f" font-weight="bold">編集反映時間(120 ページ)</text>
  <!-- axis -->
  <line x1="70" y1="350" x2="470" y2="350" stroke="#b7bdd1" stroke-width="2"/>
  <line x1="70" y1="80" x2="70" y2="350" stroke="#b7bdd1" stroke-width="2"/>
  <text x="40" y="90" text-anchor="middle" font-size="13" fill="#6d7590">ms</text>
  <!-- gridlines -->
  <line x1="70" y1="115" x2="470" y2="115" stroke="#e8eaf2" stroke-width="1"/>
  <text x="60" y="119" text-anchor="end" font-size="12" fill="#9aa1b8">800</text>
  <line x1="70" y1="203" x2="470" y2="203" stroke="#e8eaf2" stroke-width="1"/>
  <text x="60" y="207" text-anchor="end" font-size="12" fill="#9aa1b8">500</text>
  <line x1="70" y1="291" x2="470" y2="291" stroke="#e8eaf2" stroke-width="1"/>
  <text x="60" y="295" text-anchor="end" font-size="12" fill="#9aa1b8">200</text>
  <!-- bars -->
  <g id="bar-full">
    <rect x="130" y="100" width="110" height="250" rx="4" fill="#9aa1b8"/>
    <text x="185" y="88" text-anchor="middle" font-size="16" fill="#23272f">850</text>
    <text x="185" y="375" text-anchor="middle" font-size="14" fill="#6d7590">フルビルド</text>
  </g>
  <g id="bar-mirzam">
    <rect x="300" y="322" width="110" height="28" rx="4" fill="#12b8a6"/>
    <text x="355" y="310" text-anchor="middle" font-size="16" fill="#0d8a7d" font-weight="bold">95</text>
    <text x="355" y="375" text-anchor="middle" font-size="14" fill="#6d7590">差分レンダリング</text>
  </g>
  <text x="260" y="405" text-anchor="middle" font-size="12" fill="#9aa1b8">* 設計目標値(Phase 1 でベンチ常設)</text>
</svg>
