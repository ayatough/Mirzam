[package]
name = "mirzam-render"
description = "Scene -> HTML rendering with the built-in viewer runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mirzam-core.workspace = true
mirzam-syntax.workspace = true
mirzam-layout.workspace = true
mirzam-shape.workspace = true
mirzam-chart.workspace = true
mirzam-cite.workspace = true
mirzam-connect.workspace = true
mirzam-anim.workspace = true
mirzam-annot.workspace = true
mirzam-tmath.workspace = true
comrak = { version = "0.54", default-features = false, features = ["shortcodes"] }
regex = "1"
# Syntax highlighting at build time. Pure Rust, builds for wasm32, and carries
# its whole 36-grammar table for +36 KB gzipped in the browser bundle — a third
# of what the emoji table already costs, and a sixth of syntect trimmed to
# seven grammars. See docs/workstreams.md#w20.
synoptic = "2.2"
base64 = "0.22"
math-core = "0.7"
