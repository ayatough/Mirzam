[package]
name = "mirzam-cli"
description = "Mirzam command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mirzam_cli"
path = "src/lib.rs"

[[bin]]
name = "mirzam"
path = "src/main.rs"

[dependencies]
mirzam-syntax.workspace = true
mirzam-core.workspace = true
mirzam-layout.workspace = true
mirzam-render.workspace = true
mirzam-anim.workspace = true
mirzam-figure.workspace = true
tiny_http = "0.12"
serde_json = "1"
# Reading a PDF, for `import pdf`. Default features off on purpose: they add a
# date library, a thread pool and a cipher suite to answer questions this only
# asks of the page tree. `flate2` comes with it either way, and is what the
# extracted images are compressed with on the way back out.
lopdf = { version = "0.44", default-features = false }
flate2 = "1"

[dev-dependencies]
comrak = { version = "0.54", default-features = false, features = ["shortcodes"] }
