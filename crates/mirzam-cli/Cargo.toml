[package]
name = "mirzam-cli"
description = "Mirzam command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mirzam_cli"
path = "src/lib.rs"

[[bin]]
name = "mirzam"
path = "src/main.rs"

[dependencies]
mirzam-syntax.workspace = true
mirzam-core.workspace = true
mirzam-layout.workspace = true
mirzam-render.workspace = true
mirzam-anim.workspace = true
mirzam-figure.workspace = true
mirzam-pptx.workspace = true
tiny_http = "0.12"
serde_json = "1"
# Reading a PDF, for `import pdf`. Default features off on purpose: they add a
# date library, a thread pool and a cipher suite to answer questions this only
# asks of the page tree. `flate2` comes with it either way, and is what the
# extracted images are compressed with on the way back out.
lopdf = { version = "0.44", default-features = false }
flate2 = "1"
# `export video` re-packs Chromium's PNG screenshots as JPEG frames, because
# the one ffmpeg most machines already have - the trimmed build Playwright
# keeps beside its browsers - decodes MJPEG and nothing else. Both crates are
# pure Rust, so the CLI still builds with no C toolchain.
png = "0.17"
jpeg-encoder = "0.6"
# Rendering a cropped figure to SVG, so `import pdf` needs nothing installed.
# Apache-2.0 OR MIT and pure Rust, which is what makes it a dependency rather
# than a program to shell out to; `0.7` is a pin while it is pre-1.0, since a
# `0.x` caret does not cross a minor, and `Cargo.lock` fixes the patch.
hayro-svg = "0.7"
hayro-syntax = "0.7"
hayro-interpret = "0.7"

[dev-dependencies]
comrak = { version = "0.54", default-features = false, features = ["shortcodes"] }
