[package]
name = "mirzam-cli"
description = "Mirzam command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mirzam_cli"
path = "src/lib.rs"

[[bin]]
name = "mirzam"
path = "src/main.rs"

[dependencies]
mirzam-syntax.workspace = true
mirzam-core.workspace = true
mirzam-layout.workspace = true
mirzam-render.workspace = true
mirzam-anim.workspace = true
tiny_http = "0.12"
serde_json = "1"

[dev-dependencies]
comrak = { version = "0.54", default-features = false }
