[package]
name = "mirzam-wasm"
description = "WebAssembly bindings for the Mirzam core pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The withdrawn math-panel API (math_state / math_apply). Off by default so
# the shipped WASM carries none of it; the module still compiles and runs
# under `cargo test` either way.
math-editor = []

[dependencies]
mirzam-syntax.workspace = true
mirzam-core.workspace = true
mirzam-layout.workspace = true
mirzam-render.workspace = true
mirzam-tmath.workspace = true
wasm-bindgen = "0.2.100"
serde_json = "1"
