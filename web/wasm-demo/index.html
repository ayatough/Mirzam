<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a Mirzam deck in your browser</title>
<!-- Copied in beside this file by scripts/build-site.sh, so the editor tab
     carries the same mark as the rest of the site. -->
<link rel="icon" href="favicon.svg">
<style>
  /* Mirzam Dark, from brand/mirzam-theme.css. */
  :root {
    --bg: #080C18; --surface: #0E1425; --raised: #161E33; --fg: #F4F6FF;
    --muted: #8F9AB8; --line: #252E47; --accent: #9B8CFF; --accent-2: #C0B7FF;
    --green: #72C6A2; --red: #E58A9A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
  header {
    padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 600; white-space: nowrap; }
  .stat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--green); font-weight: 600; }
  .spacer { flex: 1; }
  button, label.btn {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
    color: var(--fg); background: var(--raised); border: 1px solid var(--line); white-space: nowrap;
  }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #101627; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button[aria-pressed="true"] { background: var(--raised); border-color: var(--accent); }
  input[type=file] { display: none; }
  main { flex: 1; display: flex; min-height: 0; }
  textarea {
    width: 42%; resize: horizontal; border: 0; border-right: 1px solid var(--line);
    background: var(--surface); color: var(--fg); padding: 14px;
    font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace; font-size: 13px; line-height: 1.6;
    outline: none;
  }
  #preview { flex: 1; border: 0; background: var(--bg); }
  #warnings {
    max-height: 22%; overflow: auto; padding: 6px 14px; font-size: 12px;
    color: var(--red); background: #21131A; border-top: 1px solid #45222E;
  }
  #warnings:empty { display: none; }
  #tabs { display: none; gap: 6px; }


  /* On a phone there is no room for two columns, so the two halves take turns.
     Everything else - the build, the download - is identical. */
  @media (max-width: 820px) {
    #tabs { display: flex; }
    main { flex-direction: column; }
    /* 16px, because iOS Safari force-zooms the page into any smaller input. */
    textarea { width: 100%; height: 100%; resize: none; border-right: 0; font-size: 16px; }
    body[data-pane="preview"] textarea { display: none; }
    body[data-pane="edit"] #preview { display: none; }
  }
</style>
</head>
<body data-pane="preview">
<header>
  <h1>Mirzam</h1>
  <span id="tabs">
    <button type="button" id="tab-edit" aria-pressed="false">Edit</button>
    <button type="button" id="tab-preview" aria-pressed="true">Preview</button>
  </span>
  <span class="stat" id="stat">Loading…</span>
  <span class="spacer"></span>
  <button type="button" id="new">New</button>
  <button type="button" id="sample">Sample</button>
  <label class="btn">Open .md<input type="file" id="open" accept=".md,.markdown,text/markdown,text/plain"></label>
  <label class="btn">Add image<input type="file" id="add-img" accept="image/*" multiple></label>
  <button type="button" id="save-md">Save .md</button>
  <button type="button" id="save-html" class="primary">Download deck</button>
</header>
<main>
  <textarea id="src" spellcheck="false" placeholder="# My first slide

---

## The next one

Write Markdown. A --- on its own line starts a slide."></textarea>
  <iframe id="preview"></iframe>
</main>
<div id="warnings"></div>


<script type="module">
import init, { Renderer } from './pkg/mirzam_wasm.js';

const SAMPLE = `---
title: My deck
aspect: "16:9"
math: typst
vars:
  product: Mirzam
  price: 1200
---

# {{product}} {.title-slide}

The Rust core is running in your browser

---

\`\`\`pane
+------------------+------------------+
|  head                               |
+------------------+------------------+
|                  |                  |
|  main            |  fig             |
|                  |                  |
+------------------+------------------+
\`\`\`

::: pane head
## Layout and shapes
:::

::: pane main
- The ASCII box you draw **is** the layout
- Variables and arithmetic: {{ price * 12 }} per year
- Math: $integral_0^oo e^(-x^2) d x = sqrt(pi)/2$
- An arrow runs from [this phrase]{#anchor .u} to the shape
:::

::: pane fig
:::

\`\`\`shape
rect #box at(72%, 55%) size(30%, 18%) label="Shape layer"
\`\`\`

\`\`\`connect
#anchor -> #box.w : color=@accent2
\`\`\`

---

## In short {.center}

**Edit, diff, render** - all inside the browser
`;

const srcEl = document.getElementById('src');
const preview = document.getElementById('preview');
const statEl = document.getElementById('stat');
const warnEl = document.getElementById('warnings');

await init();
const renderer = new Renderer();
// `null` is "never been here", which opens on the sample. An empty *string*
// is a draft the author emptied on purpose, and reopening on the sample would
// undo that every reload.
const saved = localStorage.getItem('mirzam-src');
srcEl.value = saved === null ? SAMPLE : saved;

// ---- Images ----
// The core has no filesystem here, so the host supplies assets by name. Adding
// a picture reads it as a data URI and hands it over: from then on the deck
// refers to it exactly as a deck on disk would, `![alt](shot.png)`, and the
// downloaded file carries the bytes inside it like any other Mirzam build.
const assets = JSON.parse(localStorage.getItem('mirzam-assets') || '{}');
function publishAssets() {
  renderer.set_assets(JSON.stringify(assets));
  try {
    localStorage.setItem('mirzam-assets', JSON.stringify(assets));
  } catch (e) {
    // A few screenshots overflow the ~5 MB quota. The pictures still work for
    // this session and still reach the download; only the draft is not kept.
    warnEl.textContent = 'Images are too large to save as a draft — download the deck before closing.';
  }
}
publishAssets();

const readAsDataUrl = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(file);
});

async function addImages(files) {
  const names = [];
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const name = file.name.replace(/[^\w.-]/g, '_');
    assets[name] = await readAsDataUrl(file);
    names.push(name);
  }
  if (!names.length) return;
  publishAssets();
  // Insert at the cursor, so a picture lands where the author was typing.
  const md = names.map((n) => `![](${n})`).join('\n') + '\n';
  const at = srcEl.selectionStart;
  srcEl.value = srcEl.value.slice(0, at) + md + srcEl.value.slice(srcEl.selectionEnd);
  srcEl.selectionStart = srcEl.selectionEnd = at + md.length;
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
}

// An empty deck renders as an empty page, which is indistinguishable from a
// build that failed. A deck with nothing in it yet is a normal place to be -
// it is where **New** lands - so the preview says which one this is.
const EMPTY_PAGE = `<!doctype html><html lang="en"><meta charset="utf-8"><style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; text-align: center;
    background: #080C18; color: #8F9AB8;
    font-family: Inter, system-ui, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif;
  }
  b { color: #F4F6FF; font-size: 15px; font-weight: 600; }
  /* A button's name inside a sentence is emphasis, not a heading. */
  p b { font-size: inherit; }
  p { margin: 0; font-size: 13px; max-width: 32em; padding: 0 16px; }
  code { font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #C0B7FF; }
</style><b>An empty deck</b>
<p>Write Markdown and it appears here. A <code>---</code> on its own line
starts the next slide.</p>
<p>Or press <b>Sample</b> for a deck that shows what the markup does.</p></html>`;

function fullRender(text) {
  const t0 = performance.now();
  if (!text.trim()) {
    preview.srcdoc = EMPTY_PAGE;
    // The baseline has to match what is displayed, and nothing is.
    renderer.reset();
    report(t0, 0, 'empty', []);
    return;
  }
  const out = renderer.render_page(text);
  preview.srcdoc = out.html;
  // Align the diff baseline with what is displayed.
  renderer.reset();
  renderer.render_changed(text);
  report(t0, out.slide_count, 'full', JSON.parse(out.warnings));
}

function update(text) {
  const t0 = performance.now();
  const res = JSON.parse(renderer.render_changed(text));
  const doc = preview.contentDocument;
  if (res.structural || !doc || !doc.querySelector('section.slide')) {
    fullRender(text);
    return;
  }
  for (const [i, html] of res.changes) {
    const sec = doc.querySelector(`section.slide[data-index="${i}"]`);
    if (sec) sec.outerHTML = html;
  }
  if (res.changes.length && doc.defaultView.__mirzamRefresh) {
    doc.defaultView.__mirzamRefresh();
  }
  report(t0, res.count, `${res.changes.length} changed`, res.warnings);
}

function report(t0, count, kind, warnings) {
  const ms = (performance.now() - t0).toFixed(1);
  statEl.innerHTML = `${count} slides / ${kind}: <b>${ms} ms</b>`;
  warnEl.textContent = (warnings || []).join(' / ');
}

let timer;
srcEl.addEventListener('input', () => {
  localStorage.setItem('mirzam-src', srcEl.value);
  clearTimeout(timer);
  timer = setTimeout(() => update(srcEl.value), 120);
});

// ---- Getting work in and out ----
// The whole point of the browser build: what comes out is the same
// self-contained file the CLI writes, so a deck written on a phone is a deck.
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Frontmatter `title:` names the file, so a deck arrives called what it is.
function deckName(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---/.exec(text);
  const t = m && /^title:\s*(.+)$/m.exec(m[1]);
  const name = t ? t[1].trim().replace(/^["']|["']$/g, '') : 'deck';
  return (name.replace(/[^\p{L}\p{N} ._-]/gu, '').trim() || 'deck').replace(/\s+/g, '-');
}

document.getElementById('save-html').addEventListener('click', () => {
  download(deckName(srcEl.value) + '.html', renderer.render_page(srcEl.value).html, 'text/html');
});
document.getElementById('save-md').addEventListener('click', () => {
  download(deckName(srcEl.value) + '.md', srcEl.value, 'text/markdown');
});
document.getElementById('add-img').addEventListener('change', async (e) => {
  await addImages(e.target.files);
  e.target.value = '';
});
// Dropping a screenshot on the source is the same thing, one step shorter.
srcEl.addEventListener('dragover', (e) => e.preventDefault());
srcEl.addEventListener('drop', async (e) => {
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  await addImages(e.dataTransfer.files);
});
// And so is pasting one, which is how a screenshot usually arrives.
srcEl.addEventListener('paste', async (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;
  e.preventDefault();
  await addImages(files);
});

document.getElementById('open').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  srcEl.value = await file.text();
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
  e.target.value = '';
});

// ---- Starting over ----
// There was no way to begin from nothing: the editor opened on the sample,
// and the only draft slot held whatever was there last. Both buttons go
// through here, so replacing work always asks first - and only when there is
// work to lose.
function replaceSource(text, question) {
  if (srcEl.value.trim() && !confirm(question)) return;
  srcEl.value = text;
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
  // On a phone the two panes take turns, and what comes after New is typing.
  setPane('edit');
  srcEl.focus();
  srcEl.setSelectionRange(0, 0);
}

document.getElementById('new').addEventListener('click', () => {
  replaceSource('', 'Start an empty deck? Your draft is only in this browser — Save .md first if you want to keep it.');
});
// The sample used to be unrecoverable: type over it and it was gone.
document.getElementById('sample').addEventListener('click', () => {
  replaceSource(SAMPLE, 'Replace your draft with the sample deck? Your draft is only in this browser — Save .md first if you want to keep it.');
});

// Nothing is uploaded anywhere, so the draft in localStorage is the only copy -
// which is also why nothing is written on unload. Every path that changes the
// source has already saved it (typing, adding an image, opening a file, New,
// Sample), so a write here could only ever save something *older* than what is
// stored: localStorage is one slot shared by every tab, and a tab still holding
// yesterday's draft would overwrite today's on the way out. On a phone that tab
// is closed by the system rather than by the author, so the loss arrives
// unprompted.

const setPane = (which) => {
  document.body.dataset.pane = which;
  document.getElementById('tab-edit').setAttribute('aria-pressed', String(which === 'edit'));
  document.getElementById('tab-preview').setAttribute('aria-pressed', String(which === 'preview'));
};
document.getElementById('tab-edit').addEventListener('click', () => setPane('edit'));
document.getElementById('tab-preview').addEventListener('click', () => setPane('preview'));

// An empty deck has nothing to preview, so the editor is where the work is.
// On a phone the panes take turns and the page opens on the preview, which
// for an empty draft is a blank page hiding the only thing worth touching.
if (!srcEl.value.trim()) setPane('edit');
fullRender(srcEl.value);
</script>
</body>
</html>
