<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a Mirzam deck in your browser</title>
<!-- Copied in beside this file by scripts/build-site.sh, so the editor tab
     carries the same mark as the rest of the site. -->
<link rel="icon" href="favicon.svg">
<style>
  /* Mirzam Dark, from brand/mirzam-theme.css. */
  :root {
    --bg: #080C18; --surface: #0E1425; --raised: #161E33; --fg: #F4F6FF;
    --muted: #8F9AB8; --line: #252E47; --accent: #9B8CFF; --accent-2: #C0B7FF;
    --green: #72C6A2; --red: #E58A9A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
  header {
    padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 600; white-space: nowrap; }
  .stat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--green); font-weight: 600; }
  .spacer { flex: 1; }
  button, label.btn {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
    color: var(--fg); background: var(--raised); border: 1px solid var(--line); white-space: nowrap;
  }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #101627; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button[aria-pressed="true"] { background: var(--raised); border-color: var(--accent); }
  input[type=file] { display: none; }
  main { flex: 1; display: flex; min-height: 0; }
  textarea {
    width: 42%; resize: horizontal; border: 0; border-right: 1px solid var(--line);
    background: var(--surface); color: var(--fg); padding: 14px;
    font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace; font-size: 13px; line-height: 1.6;
    outline: none;
  }
  #preview { flex: 1; border: 0; background: var(--bg); }
  #warnings {
    max-height: 22%; overflow: auto; padding: 6px 14px; font-size: 12px;
    color: var(--red); background: #21131A; border-top: 1px solid #45222E;
  }
  #warnings:empty { display: none; }
  #tabs { display: none; gap: 6px; }

  /* ---- The math panel: tap and place, not type ---- */
  #math-panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: none; flex-direction: column; max-height: 78%;
    background: var(--surface); border-top: 2px solid var(--accent);
    box-shadow: 0 -12px 32px rgba(0,0,0,.45);
  }
  #math-panel.open { display: flex; }
  #math-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #math-head .stat { font-size: 13px; color: var(--fg); font-weight: 600; }
  #math-preview {
    padding: 10px 14px 4px; min-height: 52px; overflow-x: auto; text-align: center;
    background: var(--bg);
  }
  #math-preview math { font-size: 26px; }
  #math-preview .math-error { color: var(--red); font-family: ui-monospace, monospace; font-size: 14px; }
  #math-src { display: block; text-align: center; padding: 0 14px 8px; color: var(--muted); background: var(--bg);
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; overflow-x: auto; white-space: nowrap; }
  /* The tap surface: the typeset formula itself, one element per node.
     touch-action: none on the nodes so a finger can drag them; a scroll
     gesture that starts on the whitespace beside the formula still scrolls. */
  #math-boxes { padding: 12px; overflow: auto; text-align: center; }
  #math-boxes math { font-size: 30px; }
  #math-boxes [data-path] { cursor: pointer; border-radius: 4px; padding: 1px 2px; touch-action: none; }
  #math-boxes [data-path].sel { background: rgba(155,140,255,.22); outline: 1.5px solid var(--accent); }
  #math-boxes [data-path].droptarget { background: rgba(114,198,162,.2); outline: 1.5px solid var(--green); }
  #math-boxes .mph { color: var(--muted); }
  .mhint { color: var(--muted); font-size: 13px; }
  #math-syms button { touch-action: none; }
  /* The thing under the finger while dragging: the glyph, and the slot it
     would land in if released here. */
  #math-ghost {
    position: fixed; z-index: 40; pointer-events: none; display: none;
    background: var(--raised); border: 1px solid var(--accent); border-radius: 8px;
    padding: 4px 9px; font-size: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  #math-ghost .zone { font-size: 11px; color: var(--accent-2); margin-left: 6px; }
  #math-err { color: var(--red); font-size: 12px; padding: 0 14px; }
  #math-err:empty { display: none; }
  #math-note { font-size: 12px; color: var(--muted); padding: 4px 14px; display: flex; gap: 8px; align-items: center; }
  #math-note:empty { display: none; }
  #math-note button { font-size: 12px; padding: 3px 8px; }
  #math-pal { padding: 6px 10px 10px; border-top: 1px solid var(--line); overflow-y: auto; }
  #math-pal .row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  #math-pal button { min-width: 42px; min-height: 40px; font-size: 16px; padding: 4px 8px; }
  #math-entry {
    flex: 1; min-width: 120px; font: inherit; font-size: 16px; padding: 6px 10px;
    background: var(--raised); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  #math-entry:focus { border-color: var(--accent); }

  /* On a phone there is no room for two columns, so the two halves take turns.
     Everything else - the build, the download - is identical. */
  @media (max-width: 820px) {
    #tabs { display: flex; }
    main { flex-direction: column; }
    /* 16px, because iOS Safari force-zooms the page into any smaller input. */
    textarea { width: 100%; height: 100%; resize: none; border-right: 0; font-size: 16px; }
    body[data-pane="preview"] textarea { display: none; }
    body[data-pane="edit"] #preview { display: none; }
  }
</style>
</head>
<body data-pane="preview">
<header>
  <h1>Mirzam</h1>
  <span id="tabs">
    <button type="button" id="tab-edit" aria-pressed="false">Edit</button>
    <button type="button" id="tab-preview" aria-pressed="true">Preview</button>
  </span>
  <span class="stat" id="stat">Loading…</span>
  <span class="spacer"></span>
  <button type="button" id="new">New</button>
  <button type="button" id="sample">Sample</button>
  <label class="btn">Open .md<input type="file" id="open" accept=".md,.markdown,text/markdown,text/plain"></label>
  <label class="btn">Add image<input type="file" id="add-img" accept="image/*" multiple></label>
  <button type="button" id="math-open">Math</button>
  <button type="button" id="save-md">Save .md</button>
  <button type="button" id="save-html" class="primary">Download deck</button>
</header>
<main>
  <textarea id="src" spellcheck="false" placeholder="# My first slide

---

## The next one

Write Markdown. A --- on its own line starts a slide."></textarea>
  <iframe id="preview"></iframe>
</main>
<div id="warnings"></div>

<!-- The math panel: the formula is built by touch, held as Typst-math text,
     and lands in the Markdown as ordinary $...$ - indistinguishable from a
     formula typed by hand. -->
<div id="math-panel">
  <div id="math-head">
    <span class="stat">Formula</span>
    <span class="spacer"></span>
    <button type="button" id="math-cancel">Cancel</button>
    <button type="button" id="math-insert" class="primary">Insert</button>
  </div>
  <div id="math-preview"></div>
  <code id="math-src"></code>
  <div id="math-boxes"></div>
  <div id="math-err"></div>
  <div id="math-note"></div>
  <div id="math-pal">
    <div class="row" id="math-structs"></div>
    <div class="row" id="math-syms"></div>
    <div class="row">
      <input id="math-entry" placeholder="type here — ↵ places it" autocomplete="off">
      <button type="button" id="math-parent" title="Select the enclosing node">▲</button>
      <button type="button" id="math-del">⌫</button>
    </div>
  </div>
</div>
<div id="math-ghost"></div>

<script type="module">
import init, { Renderer, math_state, math_apply } from './pkg/mirzam_wasm.js';

const SAMPLE = `---
title: My deck
aspect: "16:9"
math: typst
vars:
  product: Mirzam
  price: 1200
---

# {{product}} {.title-slide}

The Rust core is running in your browser

---

\`\`\`pane
+------------------+------------------+
|  head                               |
+------------------+------------------+
|                  |                  |
|  main            |  fig             |
|                  |                  |
+------------------+------------------+
\`\`\`

::: pane head
## Layout and shapes
:::

::: pane main
- The ASCII box you draw **is** the layout
- Variables and arithmetic: {{ price * 12 }} per year
- Math: $integral_0^oo e^(-x^2) d x = sqrt(pi)/2$ — tap **Math** to edit it
- An arrow runs from [this phrase]{#anchor .u} to the shape
:::

::: pane fig
:::

\`\`\`shape
rect #box at(72%, 55%) size(30%, 18%) label="Shape layer"
\`\`\`

\`\`\`connect
#anchor -> #box.w : color=@accent2
\`\`\`

---

## In short {.center}

**Edit, diff, render** - all inside the browser
`;

const srcEl = document.getElementById('src');
const preview = document.getElementById('preview');
const statEl = document.getElementById('stat');
const warnEl = document.getElementById('warnings');

await init();
const renderer = new Renderer();
// `null` is "never been here", which opens on the sample. An empty *string*
// is a draft the author emptied on purpose, and reopening on the sample would
// undo that every reload.
const saved = localStorage.getItem('mirzam-src');
srcEl.value = saved === null ? SAMPLE : saved;

// ---- Images ----
// The core has no filesystem here, so the host supplies assets by name. Adding
// a picture reads it as a data URI and hands it over: from then on the deck
// refers to it exactly as a deck on disk would, `![alt](shot.png)`, and the
// downloaded file carries the bytes inside it like any other Mirzam build.
const assets = JSON.parse(localStorage.getItem('mirzam-assets') || '{}');
function publishAssets() {
  renderer.set_assets(JSON.stringify(assets));
  try {
    localStorage.setItem('mirzam-assets', JSON.stringify(assets));
  } catch (e) {
    // A few screenshots overflow the ~5 MB quota. The pictures still work for
    // this session and still reach the download; only the draft is not kept.
    warnEl.textContent = 'Images are too large to save as a draft — download the deck before closing.';
  }
}
publishAssets();

const readAsDataUrl = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(file);
});

async function addImages(files) {
  const names = [];
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const name = file.name.replace(/[^\w.-]/g, '_');
    assets[name] = await readAsDataUrl(file);
    names.push(name);
  }
  if (!names.length) return;
  publishAssets();
  // Insert at the cursor, so a picture lands where the author was typing.
  const md = names.map((n) => `![](${n})`).join('\n') + '\n';
  const at = srcEl.selectionStart;
  srcEl.value = srcEl.value.slice(0, at) + md + srcEl.value.slice(srcEl.selectionEnd);
  srcEl.selectionStart = srcEl.selectionEnd = at + md.length;
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
}

// An empty deck renders as an empty page, which is indistinguishable from a
// build that failed. A deck with nothing in it yet is a normal place to be -
// it is where **New** lands - so the preview says which one this is.
const EMPTY_PAGE = `<!doctype html><html lang="en"><meta charset="utf-8"><style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; text-align: center;
    background: #080C18; color: #8F9AB8;
    font-family: Inter, system-ui, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif;
  }
  b { color: #F4F6FF; font-size: 15px; font-weight: 600; }
  /* A button's name inside a sentence is emphasis, not a heading. */
  p b { font-size: inherit; }
  p { margin: 0; font-size: 13px; max-width: 32em; padding: 0 16px; }
  code { font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #C0B7FF; }
</style><b>An empty deck</b>
<p>Write Markdown and it appears here. A <code>---</code> on its own line
starts the next slide.</p>
<p>Or press <b>Sample</b> for a deck that shows what the markup does.</p></html>`;

function fullRender(text) {
  const t0 = performance.now();
  if (!text.trim()) {
    preview.srcdoc = EMPTY_PAGE;
    // The baseline has to match what is displayed, and nothing is.
    renderer.reset();
    report(t0, 0, 'empty', []);
    return;
  }
  const out = renderer.render_page(text);
  preview.srcdoc = out.html;
  // Align the diff baseline with what is displayed.
  renderer.reset();
  renderer.render_changed(text);
  report(t0, out.slide_count, 'full', JSON.parse(out.warnings));
}

function update(text) {
  const t0 = performance.now();
  const res = JSON.parse(renderer.render_changed(text));
  const doc = preview.contentDocument;
  if (res.structural || !doc || !doc.querySelector('section.slide')) {
    fullRender(text);
    return;
  }
  for (const [i, html] of res.changes) {
    const sec = doc.querySelector(`section.slide[data-index="${i}"]`);
    if (sec) sec.outerHTML = html;
  }
  if (res.changes.length && doc.defaultView.__mirzamRefresh) {
    doc.defaultView.__mirzamRefresh();
  }
  report(t0, res.count, `${res.changes.length} changed`, res.warnings);
}

function report(t0, count, kind, warnings) {
  const ms = (performance.now() - t0).toFixed(1);
  statEl.innerHTML = `${count} slides / ${kind}: <b>${ms} ms</b>`;
  warnEl.textContent = (warnings || []).join(' / ');
}

let timer;
srcEl.addEventListener('input', () => {
  localStorage.setItem('mirzam-src', srcEl.value);
  clearTimeout(timer);
  timer = setTimeout(() => update(srcEl.value), 120);
});

// ---- Getting work in and out ----
// The whole point of the browser build: what comes out is the same
// self-contained file the CLI writes, so a deck written on a phone is a deck.
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Frontmatter `title:` names the file, so a deck arrives called what it is.
function deckName(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---/.exec(text);
  const t = m && /^title:\s*(.+)$/m.exec(m[1]);
  const name = t ? t[1].trim().replace(/^["']|["']$/g, '') : 'deck';
  return (name.replace(/[^\p{L}\p{N} ._-]/gu, '').trim() || 'deck').replace(/\s+/g, '-');
}

document.getElementById('save-html').addEventListener('click', () => {
  download(deckName(srcEl.value) + '.html', renderer.render_page(srcEl.value).html, 'text/html');
});
document.getElementById('save-md').addEventListener('click', () => {
  download(deckName(srcEl.value) + '.md', srcEl.value, 'text/markdown');
});
document.getElementById('add-img').addEventListener('change', async (e) => {
  await addImages(e.target.files);
  e.target.value = '';
});
// Dropping a screenshot on the source is the same thing, one step shorter.
srcEl.addEventListener('dragover', (e) => e.preventDefault());
srcEl.addEventListener('drop', async (e) => {
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  await addImages(e.dataTransfer.files);
});
// And so is pasting one, which is how a screenshot usually arrives.
srcEl.addEventListener('paste', async (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;
  e.preventDefault();
  await addImages(files);
});

document.getElementById('open').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  srcEl.value = await file.text();
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
  e.target.value = '';
});

// ---- Starting over ----
// There was no way to begin from nothing: the editor opened on the sample,
// and the only draft slot held whatever was there last. Both buttons go
// through here, so replacing work always asks first - and only when there is
// work to lose.
function replaceSource(text, question) {
  if (srcEl.value.trim() && !confirm(question)) return;
  srcEl.value = text;
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
  // On a phone the two panes take turns, and what comes after New is typing.
  setPane('edit');
  srcEl.focus();
  srcEl.setSelectionRange(0, 0);
}

document.getElementById('new').addEventListener('click', () => {
  replaceSource('', 'Start an empty deck? Your draft is only in this browser — Save .md first if you want to keep it.');
});
// The sample used to be unrecoverable: type over it and it was gone.
document.getElementById('sample').addEventListener('click', () => {
  replaceSource(SAMPLE, 'Replace your draft with the sample deck? Your draft is only in this browser — Save .md first if you want to keep it.');
});

// Nothing is uploaded anywhere, so the draft in localStorage is the only copy -
// which is also why nothing is written on unload. Every path that changes the
// source has already saved it (typing, adding an image, opening a file, New,
// Sample), so a write here could only ever save something *older* than what is
// stored: localStorage is one slot shared by every tab, and a tab still holding
// yesterday's draft would overwrite today's on the way out. On a phone that tab
// is closed by the system rather than by the author, so the loss arrives
// unprompted.

const setPane = (which) => {
  document.body.dataset.pane = which;
  document.getElementById('tab-edit').setAttribute('aria-pressed', String(which === 'edit'));
  document.getElementById('tab-preview').setAttribute('aria-pressed', String(which === 'preview'));
};
document.getElementById('tab-edit').addEventListener('click', () => setPane('edit'));
document.getElementById('tab-preview').addEventListener('click', () => setPane('preview'));

// ---- The math panel ----
// The formula is Typst-math text and nothing else: every tap goes to the
// wasm side as one operation, which parses, edits the tree, and prints the
// text back. The JS here keeps no model - it renders what it is handed.
const mathPanel = document.getElementById('math-panel');
const mathPreview = document.getElementById('math-preview');
const mathSrcEl = document.getElementById('math-src');
const mathBoxes = document.getElementById('math-boxes');
const mathErr = document.getElementById('math-err');
const mathNote = document.getElementById('math-note');
const mathEntry = document.getElementById('math-entry');

let mathSrc = '';    // the formula being built, always Typst-math
let mathSel = null;  // selected path (array of child indices), or null
let mathReplacing = false; // whether Insert replaces an existing formula
let mathAnchor = ''; // the exact `$...$` the panel anchors to in the deck
let mathLatex = '';  // the same formula as LaTeX, for LaTeX-dialect decks
let mathTree = [];
let mathSurface = ''; // the tap surface: MathML with data-path on every node

// Spellings the boxes show as the glyph the reader will get.
const GLYPHS = {
  alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', theta:'θ', lambda:'λ',
  mu:'μ', nu:'ν', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', phi:'φ', psi:'ψ', omega:'ω',
  Gamma:'Γ', Delta:'Δ', Theta:'Θ', Lambda:'Λ', Pi:'Π', Sigma:'Σ', Phi:'Φ', Psi:'Ψ', Omega:'Ω',
  infinity:'∞', oo:'∞', partial:'∂', nabla:'∇', hbar:'ℏ', sum:'Σ', product:'Π',
  integral:'∫', 'integral.cont':'∮', times:'×', dot:'⋅', 'dot.op':'⋅', pm:'±',
  '->':'→', '=>':'⇒', '<-':'←', '!=':'≠', '<=':'≤', '>=':'≥', 'subset.eq':'⊆',
  in:'∈', 'in.not':'∉', subset:'⊂', union:'∪', sect:'∩', approx:'≈', dots:'…', '...':'…',
  sqrt:'√', abs:'|·|', norm:'‖·‖', hat:'ˆ', arrow:'⃗', ddot:'¨', tilde:'˜',
  bb:'𝔹', cal:'𝓒', overline:'‾', underline:'_', mat:'⊞', cases:'{', vec:'⟨⟩',
};
const glyph = (t) => GLYPHS[t] ?? t;

function nodeAtPath(tree, path) {
  let list = tree, node = null;
  for (const i of path) {
    node = list[i];
    if (!node) return null;
    list = node.c || [];
  }
  return node;
}

function refreshMath(state) {
  const res = state ?? JSON.parse(math_state(mathSrc));
  if (!res.ok) { mathErr.textContent = res.error; return; }
  mathErr.textContent = '';
  mathSrc = res.src;
  mathLatex = res.latex ?? '';
  mathTree = res.tree;
  mathSurface = res.emathml ?? '';
  mathPreview.innerHTML = res.mathml || '<span class="mhint">—</span>';
  const typst = deckHasTypst(srcEl.value);
  mathSrcEl.textContent = mathSrc ? `$${typst ? mathSrc : mathLatex}$` : '';
  if (mathSel && !nodeAtPath(mathTree, mathSel)) mathSel = null;
  renderSurface();
  renderNote(typst);
}

// The tap surface is the typeset formula itself: every element carries the
// path of the node it draws, so a finger on the rendered mathematics names
// a node — no proxy boxes in between.
function renderSurface() {
  if (!mathTree.length) {
    mathBoxes.innerHTML = '<span class="mhint">Tap a symbol below, or type in the box and press Put</span>';
    return;
  }
  mathBoxes.innerHTML = mathSurface;
  if (mathSel) {
    mathBoxes.querySelector(`[data-path="${mathSel.join(',')}"]`)?.classList.add('sel');
  }
}

function renderNote(typst) {
  mathNote.innerHTML = '';
  // The panel adapts to the deck's dialect rather than flipping the deck:
  // flipping would break every LaTeX formula already in it.
  if (!typst) {
    if (/\$[^$\n]+\$/.test(srcEl.value)) {
      mathNote.append('This deck’s math is LaTeX, so the formula will be inserted as LaTeX. Re-editing it here needs a `math: typst` deck.');
    } else {
      mathNote.append('Inserted as LaTeX. For Typst-math source, editable here later, set `math: typst`: ');
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'Set it';
      b.addEventListener('click', () => { setTypstFrontmatter(); refreshMath(); });
      mathNote.appendChild(b);
    }
  }
}

// One listener for the whole surface: the deepest element with a path under
// the finger is the node. Tapping the empty space beside the formula clears
// the selection, so the next placement grows the formula at the end.
mathBoxes.addEventListener('click', (e) => {
  // The click synthesised from a drop's own pointerup arrives within the
  // same task; anything later is a new, intentional tap.
  if (performance.now() - dragDropAt < 120) return;
  const hit = e.target.closest('[data-path]');
  if (!hit || !mathBoxes.contains(hit)) {
    mathSel = null;
    renderSurface();
    return;
  }
  mathSel = hit.dataset.path.split(',').map(Number);
  renderSurface();
});

// ---- Drag and drop ----
// A symbol from the palette, or a node of the formula itself, can be dragged
// onto the typeset formula. Where it lands inside the target decides the
// slot: the top of a node is its shoulder, the bottom its subscript, the
// left and right its neighbours — and a hole just takes what it is given.
// A quick tap stays a tap: the drag begins only once the finger has moved.
const ghost = document.getElementById('math-ghost');
let drag = null;     // {src, label, active, x0, y0}
// The click right after a completed drop must not re-select; but a drop is
// not always followed by one, so this is a moment, not a flag a later tap
// could inherit.
let dragDropAt = 0;

function dragSourceDown(e, src, label) {
  if (e.button !== undefined && e.button !== 0) return;
  drag = { src, label, active: false, x0: e.clientX, y0: e.clientY };
}

const ZONE_LABEL = { into: '□', sup: 'x²', sub: 'x₂', before: '⇤', after: '⇥' };

function dropZoneAt(x, y) {
  const el = document.elementFromPoint(x, y)?.closest('#math-boxes [data-path]');
  if (!el) return null;
  const path = el.dataset.path.split(',').map(Number);
  if (drag.src.kind === 'node' && path.join(',') === drag.src.path.join(',')) return null;
  const node = nodeAtPath(mathTree, path);
  if (node && node.ph) return { el, path, zone: 'into' };
  const r = el.getBoundingClientRect();
  const fy = (y - r.top) / r.height;
  const fx = (x - r.left) / r.width;
  const zone = fy < 0.4 ? 'sup' : fy > 0.6 ? 'sub' : fx < 0.5 ? 'before' : 'after';
  return { el, path, zone };
}

document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
    drag.active = true;
    ghost.style.display = 'block';
  }
  ghost.style.left = `${e.clientX + 14}px`;
  ghost.style.top = `${e.clientY - 34}px`;
  mathBoxes.querySelector('.droptarget')?.classList.remove('droptarget');
  const hit = dropZoneAt(e.clientX, e.clientY);
  if (hit) hit.el.classList.add('droptarget');
  ghost.innerHTML = '';
  ghost.append(drag.label);
  const z = document.createElement('span');
  z.className = 'zone';
  z.textContent = hit ? ZONE_LABEL[hit.zone] : '';
  ghost.appendChild(z);
});

function endDrag(e, drop) {
  if (!drag) return;
  const wasActive = drag.active;
  const src = drag.src;
  const hit = wasActive && drop ? dropZoneAt(e.clientX, e.clientY) : null;
  drag = null;
  ghost.style.display = 'none';
  mathBoxes.querySelector('.droptarget')?.classList.remove('droptarget');
  if (!hit) return;
  dragDropAt = performance.now();
  if (src.kind === 'node') {
    applyMath({ op: 'move', from: src.path, to: hit.path, slot: hit.zone }, () => null);
    return;
  }
  if (hit.zone === 'into') {
    applyMath({ op: 'replace', path: hit.path, src: src.text }, () => hit.path);
  } else if (hit.zone === 'before' || hit.zone === 'after') {
    const parent = hit.path.slice(0, -1);
    const index = hit.path[hit.path.length - 1] + (hit.zone === 'after' ? 1 : 0);
    applyMath({ op: 'insert', parent, index, src: src.text }, () => [...parent, index]);
  } else {
    // A palette symbol onto a shoulder: make the slot, then fill the hole
    // it opened — two operations, the second aimed with the first's tree.
    const first = JSON.parse(math_apply(mathSrc, JSON.stringify({ op: hit.zone, path: hit.path })));
    if (!first.ok) {
      mathErr.textContent = first.error;
      return;
    }
    const node = nodeAtPath(first.tree, hit.path);
    const hole = hit.zone === 'sub' ? 1 : 1 + (node && node.sub ? 1 : 0);
    mathSrc = first.src;
    mathTree = first.tree;
    applyMath({ op: 'replace', path: [...hit.path, hole], src: src.text }, () => [...hit.path, hole]);
  }
}

document.addEventListener('pointerup', (e) => endDrag(e, true));
document.addEventListener('pointercancel', (e) => endDrag(e, false));

// Sources: the palette symbols (by delegation — the buttons are built after
// this line runs)…
document.getElementById('math-syms').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('button');
  if (b) dragSourceDown(e, { kind: 'text', text: b.title }, b.textContent);
});
// …and the formula's own nodes, likewise: the surface is rebuilt on every
// edit, the listener is not.
mathBoxes.addEventListener('pointerdown', (e) => {
  const hit = e.target.closest('[data-path]');
  if (!hit || !mathBoxes.contains(hit)) return;
  const path = hit.dataset.path.split(',').map(Number);
  dragSourceDown(e, { kind: 'node', path }, hit.textContent.trim().slice(0, 6) || '▣');
});

function applyMath(op, selectAfter) {
  const res = JSON.parse(math_apply(mathSrc, JSON.stringify(op)));
  if (!res.ok) { mathErr.textContent = res.error; return; }
  if (selectAfter) mathSel = selectAfter(res);
  refreshMath(res);
}

// Placing something. The context decides what a selection means for it:
// a hole is filled; a node in a sequence is continued after (that is what
// typing left to right is); a node in a fixed slot — a denominator, an
// exponent — is replaced, because "after" does not exist there.
function put(text) {
  if (!text) return;
  if (!mathSel) {
    applyMath({ op: 'append', src: text }, (res) => [res.tree.length - 1]);
    return;
  }
  const node = nodeAtPath(mathTree, mathSel);
  if (node && node.ph) {
    applyMath({ op: 'replace', path: mathSel, src: text }, () => mathSel);
    return;
  }
  const parent = mathSel.slice(0, -1);
  const index = mathSel[mathSel.length - 1] + 1;
  const res = JSON.parse(math_apply(mathSrc, JSON.stringify({ op: 'insert', parent, index, src: text })));
  if (res.ok) {
    mathSel = [...parent, index];
    refreshMath(res);
    return;
  }
  applyMath({ op: 'replace', path: mathSel, src: text }, () => mathSel);
}

// Structure needs somewhere to go: the selection, or a fresh hole at the end.
function structure(op) {
  const run = (path) => {
    if (op.kind === 'call') {
      applyMath({ op: 'call', name: op.name, path }, () => path);
    } else {
      // Select the slot the operation opened, so the next tap fills it.
      applyMath({ op: op.kind, path }, (res) => {
        const node = nodeAtPath(res.tree, path);
        if (!node) return path;
        if (op.kind === 'frac') return [...path, 1];
        if (op.kind === 'sub') return [...path, 1];
        return [...path, 1 + (node.sub ? 1 : 0)]; // sup sits after sub
      });
    }
  };
  if (mathSel) {
    run(mathSel);
  } else {
    // Nothing selected: start from a hole so the shape appears first.
    const res = JSON.parse(math_apply(mathSrc, JSON.stringify({ op: 'append', src: '' })));
    if (!res.ok) { mathErr.textContent = res.error; return; }
    mathSrc = res.src;
    mathTree = res.tree;
    run([res.tree.length - 1]);
  }
}

const STRUCTS = [
  { label: 'a/b', kind: 'frac' },
  { label: 'x²', kind: 'sup' },
  { label: 'x₂', kind: 'sub' },
  { label: '√', kind: 'call', name: 'sqrt' },
  { label: '|x|', kind: 'call', name: 'abs' },
  { label: 'x̂', kind: 'call', name: 'hat' },
  { label: 'v⃗', kind: 'call', name: 'arrow' },
  { label: 'ẋ', kind: 'call', name: 'dot' },
];
for (const s of STRUCTS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.label;
  b.title = s.kind === 'call' ? s.name : s.kind;
  b.addEventListener('click', () => structure(s));
  document.getElementById('math-structs').appendChild(b);
}

const SYMS = ['alpha', 'beta', 'pi', 'theta', 'lambda', 'omega', 'infinity', 'partial',
  'sum', 'integral', '->', '=>', '!=', '<=', '>=', 'dot', 'pm', 'times', '=', '+', '-'];
for (const s of SYMS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = glyph(s);
  b.title = s;
  b.addEventListener('click', () => put(s));
  document.getElementById('math-syms').appendChild(b);
}

// The entry has no button: Enter or space places what was typed, which is
// what typing a formula out feels like.
mathEntry.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    put(mathEntry.value.trim());
    mathEntry.value = '';
  }
});
document.getElementById('math-del').addEventListener('click', () => {
  if (!mathSel) return;
  applyMath({ op: 'delete', path: mathSel }, () => null);
});

// A finger always lands on the deepest node; this steps the selection out to
// the thing that contains it — the whole fraction rather than its numerator.
document.getElementById('math-parent').addEventListener('click', () => {
  if (mathSel && mathSel.length > 1) {
    mathSel = mathSel.slice(0, -1);
    renderSurface();
  }
});

function deckHasTypst(v) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---/.exec(v);
  return !!(m && /^math:\s*typst\s*$/m.exec(m[1]));
}

// `math: typst` is a per-deck switch. The panel only offers it while the
// deck has no math yet — on a deck with LaTeX formulas the flip would break
// them, so there the panel adapts its output instead.
function setTypstFrontmatter() {
  const v = srcEl.value;
  const cursor = srcEl.selectionStart ?? 0;
  const m = /^---\r?\n([\s\S]*?\r?\n)---/.exec(v);
  const insPos = m ? m.index + 4 : 0;
  const inserted = m ? 'math: typst\n' : '---\nmath: typst\n---\n\n';
  srcEl.value = v.slice(0, insPos) + inserted + v.slice(insPos);
  // Everything after the insertion moved; keep the cursor with its text.
  // The panel's own anchor is a string, not an offset, so it needs nothing.
  if (cursor >= insPos) {
    srcEl.selectionStart = srcEl.selectionEnd = cursor + inserted.length;
  }
  localStorage.setItem('mirzam-src', srcEl.value);
  fullRender(srcEl.value);
}

document.getElementById('math-open').addEventListener('click', () => {
  setPane('edit');
  const v = srcEl.value;
  const pos = srcEl.selectionStart ?? 0;
  mathAnchor = '';
  mathReplacing = false;
  mathSrc = '';
  // The cursor inside an existing $...$ means "edit this one" — when the
  // deck's formulas are Typst-math, the only dialect this panel reads. In a
  // LaTeX deck the formula cannot be loaded, and a new one must not be
  // dropped into the middle of it, so it goes right after instead. The
  // anchor is the matched *text*, not its offsets: the deck can be edited
  // underneath the open panel, and text can be found again where an offset
  // silently points somewhere else.
  const re = /\$([^$\n]+)\$/g;
  let m;
  while ((m = re.exec(v))) {
    if (pos >= m.index && pos <= m.index + m[0].length) {
      mathAnchor = m[0];
      if (deckHasTypst(v)) {
        mathReplacing = true;
        mathSrc = m[1].trim();
      }
      break;
    }
  }
  mathSel = null;
  mathPanel.classList.add('open');
  refreshMath();
});

function closeMath() {
  mathPanel.classList.remove('open');
}
document.getElementById('math-cancel').addEventListener('click', closeMath);

document.getElementById('math-insert').addEventListener('click', () => {
  if (mathSrc.trim()) {
    // The deck's dialect decides what lands in the text: Typst-math source
    // when the deck reads it, its LaTeX twin when the deck reads LaTeX.
    let text = `$${deckHasTypst(srcEl.value) ? mathSrc : mathLatex}$`;
    const v = srcEl.value;
    let from;
    let to;
    // Find the formula the panel anchors to, wherever the deck's edits have
    // pushed it since the panel opened.
    const at = mathAnchor ? v.indexOf(mathAnchor) : -1;
    if (at >= 0) {
      if (mathReplacing) {
        from = at;
        to = at + mathAnchor.length;
      } else {
        from = to = at + mathAnchor.length;
      }
    } else {
      from = srcEl.selectionStart ?? v.length;
      to = srcEl.selectionEnd ?? v.length;
      // A cursor inside the frontmatter — or never placed, or an anchor the
      // edits deleted — must not drop a formula into the YAML. Go to the end.
      const fm = /^---\r?\n[\s\S]*?\r?\n---/.exec(v);
      if (fm && from < fm[0].length + 1) {
        from = to = v.length;
        if (!v.endsWith('\n\n')) text = (v.endsWith('\n') ? '\n' : '\n\n') + text;
      }
    }
    srcEl.value = v.slice(0, from) + text + v.slice(to);
    srcEl.selectionStart = srcEl.selectionEnd = from + text.length;
    localStorage.setItem('mirzam-src', srcEl.value);
    fullRender(srcEl.value);
  }
  closeMath();
});

// An empty deck has nothing to preview, so the editor is where the work is.
// On a phone the panes take turns and the page opens on the preview, which
// for an empty draft is a blank page hiding the only thing worth touching.
if (!srcEl.value.trim()) setPane('edit');
fullRender(srcEl.value);
</script>
</body>
</html>
