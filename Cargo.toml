[workspace]
resolver = "2"
members = [
    "crates/mirzam-syntax",
    "crates/mirzam-core",
    "crates/mirzam-layout",
    "crates/mirzam-shape",
    "crates/mirzam-chart",
    "crates/mirzam-cite",
    "crates/mirzam-connect",
    "crates/mirzam-anim",
    "crates/mirzam-annot",
    "crates/mirzam-tmath",
    "crates/mirzam-render",
    "crates/mirzam-cli",
    "crates/mirzam-wasm",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
# Set by the dependency graph, not by us: `math-core` needs 1.91. CI builds the
# workspace on exactly this toolchain so the number stays true.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/ayatough/Mirzam"

# The release profile is what ships: prebuilt binaries are cut from it, and a
# deck's build time is the number in the README. Whole-program optimisation and
# a stripped binary are worth the slower link here, since it happens once per
# tag rather than once per edit.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
mirzam-syntax = { path = "crates/mirzam-syntax" }
mirzam-core = { path = "crates/mirzam-core" }
mirzam-layout = { path = "crates/mirzam-layout" }
mirzam-shape = { path = "crates/mirzam-shape" }
mirzam-chart = { path = "crates/mirzam-chart" }
mirzam-cite = { path = "crates/mirzam-cite" }
mirzam-connect = { path = "crates/mirzam-connect" }
mirzam-anim = { path = "crates/mirzam-anim" }
mirzam-annot = { path = "crates/mirzam-annot" }
mirzam-tmath = { path = "crates/mirzam-tmath" }
mirzam-render = { path = "crates/mirzam-render" }
comrak = "0.39"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
