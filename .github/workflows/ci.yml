name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      # /next/ shows the changelog's unreleased section, rendered by a
      # converter that `build-site.sh` runs in the Pages job - after this
      # workflow is green, where a reader finds the breakage before anyone
      # here does. An entry quoting a fence came out as one monospace block
      # that way. This is the same converter, checked before the merge.
      - name: the changelog renders on the site
        run: python3 scripts/changelog-html.py --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # Quality gates:
      #  - golden tests (catch output regressions)
      #  - CommonMark compatibility (extensions never break plain Markdown)
      #  - incremental build equivalence (incremental == full rebuild)
      - name: test
        run: cargo test --workspace

      # An off-by-default feature is invisible to every line above: neither
      # `--workspace` nor `--all-targets` turns one on, so the derives and the
      # round-trip test behind `mirzam-shape/serde` would compile only on the
      # machine of whoever remembered to ask for them. The consumer that reads
      # the model across a boundary is not in this repository and cannot fail
      # this build, so the field that stops deriving `Serialize` has to fail it
      # here or nowhere.
      - name: test off-by-default features
        run: |
          cargo clippy -p mirzam-shape --all-targets --features serde
          cargo test -p mirzam-shape --features serde

      - name: build sample decks
        run: |
          for deck in 01-start 02-writing 03-layout 04-components 05-motion 06-theming pitch research seminar; do
            cargo run -q --bin mirzam -- build "examples/$deck.md" -o "/tmp/out-$deck"
          done

  versions:
    name: version consistency
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The version is written in five files. Nothing but somebody's memory
      # used to keep them in step, which is how the README sat at v0.2.0
      # through the whole of v0.3.0 - a drift no test could see, because
      # nothing was broken, only untrue.
      - run: ./scripts/check-versions.sh

  extension:
    name: editor host
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The webview has no filesystem, so the extension host decides which of a
      # deck's files ever reach the renderer. Nothing else can see that list
      # drift: a form it misses previews as a broken deck and builds perfectly
      # from the CLI. No dependencies - it is node's own test runner.
      - name: extension host tests
        run: node --test editors/vscode/test/*.test.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The other half of the editor's story: a language server has no output
      # of its own, so the only way to know it still speaks is to speak to it.
      # The probe runs a whole session against every sample deck and fails if
      # any of them draws a diagnostic - which also makes it the check that a
      # sample deck is clean by more than the golden test's reckoning. No
      # browser: the layout findings are not this server's to report.
      #
      # `04-components` is the one deck left out: it holds a `mermaid` fence,
      # and this job has no renderer, so it would report the documented
      # degradation as a problem. The layout job installs mermaid-cli and
      # holds that deck to `--strict` instead.
      - name: the language server answers, and the samples are clean
        run: |
          node scripts/lsp-probe.mjs --expect-clean \
            examples/01-start.md examples/02-writing.md examples/03-layout.md \
            examples/05-motion.md examples/06-theming.md \
            examples/pitch.md examples/research.md examples/seminar.md \
            examples/slideshow.md

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in the root manifest is a promise to anyone building
      # from source. Reading it from the manifest rather than pinning it here
      # means the two can never disagree.
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  layout:
    name: layout check
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Renders each deck in a browser and fails on clipped or overlapping
      # content - the class of bug HTML snapshots cannot see.
      - name: install browser
        # Bounded, and retried, because this step is where the runner hangs.
        # A Pages build sat twenty minutes inside `--with-deps` on 2026-08-19
        # while the identical step in CI finished in seventy-five seconds, and
        # with no limit anywhere it would have held the deploy for the six
        # hours GitHub allows a job by default. A hang is not a failure the
        # shell can see, so each attempt is given five minutes of its own and
        # the retry is what turns an infrastructure stall into a slow build
        # rather than a lost one. Both commands are idempotent, so an attempt
        # that got half way costs the next one nothing.
        run: |
          for attempt in 1 2 3; do
            if timeout -k 30s 5m bash -c 'npm i playwright-core && npx playwright install --with-deps chromium'; then
              exit 0
            fi
            echo "attempt $attempt did not finish inside five minutes; retrying"
          done
          echo "the browser would not install in three attempts"
          exit 1
      # The component gallery holds a `mermaid` fence, and a fence nothing draws
      # is a code block: the layout check would otherwise measure a deck no
      # reader gets. `mmdc` brings its own Chromium through puppeteer rather
      # than reusing the one above - twenty-odd seconds and half a gigabyte of
      # runner disk, against a version pairing that has to keep agreeing for
      # nothing in return.
      #
      # `@mermaid-js/mermaid-cli` is not a repository dependency either (see
      # AGENTS.md); it is installed for the job.
      - name: install the diagram renderer
        run: |
          npm i @mermaid-js/mermaid-cli
          echo "MIRZAM_MMDC=$PWD/node_modules/.bin/mmdc" >> "$GITHUB_ENV"
      # A renderer that did not run is a silent downgrade: the deck still
      # builds, the fence stays a code block, and every check below passes on a
      # deck nobody publishes. `--strict` is the flag that exists for exactly
      # this - it fails a build that produced any warning at all - and the
      # gallery is the deck held to it, because it is the one with a fence.
      - name: the gallery's diagram is drawn, not quoted
        run: cargo run -q --bin mirzam -- build examples/04-components.md -o "$(mktemp -d)" --strict
      # The performance report is published on the site as a deck, so every one
      # of its sections has to keep fitting a slide. It is checked with the
      # flags `scripts/build-site.sh` builds it with, and given eight pixels of
      # slack, because a runner's fonts are not a reader's and a section that
      # only just fits here would clip there.
      - name: the performance report still fits its slides
        run: |
          chromium="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          cargo run -q --bin mirzam -- check docs/reports/2026-08-performance.md \
            --split h2 --fit shrink --theme mirzam --mode dark \
            --min-slack 8 --chromium "$chromium"
      - name: check layout
        run: |
          node scripts/check-layout.mjs --build \
            examples/01-start.md examples/02-writing.md examples/03-layout.md \
            examples/04-components.md examples/05-motion.md examples/06-theming.md \
            examples/pitch.md examples/research.md examples/seminar.md
      # And the viewer's own behaviour, which the layout check cannot see: it
      # measures the slide, not what happens when somebody presses a key. `O`
      # threw on the gallery deck and did nothing at all, with correct markup
      # and every slide fitting.
      - name: check the viewer
        run: |
          node scripts/check-viewer.mjs --build \
            examples/01-start.md examples/02-writing.md examples/03-layout.md \
            examples/04-components.md examples/05-motion.md examples/06-theming.md \
            examples/pitch.md examples/research.md examples/seminar.md

  bench:
    name: benchmark
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tracks that single-slide edit latency stays flat as decks grow.
      # Values are logged rather than asserted, since CI runners vary.
      - name: run benchmark
        run: cargo run --release -p mirzam-cli --bin mirzam-bench

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    # The backstop against a runner that stops making progress. Every job here
    # finishes in about two minutes warm, and the slowest cold build is nowhere
    # near this; what the number is for is the case where a step hangs, which
    # GitHub otherwise lets sit for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # build-wasm.sh installs the matching wasm-bindgen CLI itself.
      - name: build
        run: ./scripts/build-wasm.sh pkg
      - uses: actions/upload-artifact@v4
        with:
          name: mirzam-wasm
          path: pkg/
