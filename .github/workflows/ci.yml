name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # Quality gates:
      #  - golden tests (catch output regressions)
      #  - CommonMark compatibility (extensions never break plain Markdown)
      #  - incremental build equivalence (incremental == full rebuild)
      - name: test
        run: cargo test --workspace

      - name: build sample decks
        run: |
          for deck in 01-start 02-writing 03-layout 04-components 05-motion 06-theming pitch seminar; do
            cargo run -q --bin mirzam -- build "examples/$deck.md" -o "/tmp/out-$deck"
          done

  versions:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version is written in five files. Nothing but somebody's memory
      # used to keep them in step, which is how the README sat at v0.2.0
      # through the whole of v0.3.0 - a drift no test could see, because
      # nothing was broken, only untrue.
      - run: ./scripts/check-versions.sh

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in the root manifest is a promise to anyone building
      # from source. Reading it from the manifest rather than pinning it here
      # means the two can never disagree.
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  layout:
    name: layout check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Renders each deck in a browser and fails on clipped or overlapping
      # content - the class of bug HTML snapshots cannot see.
      - name: install browser
        run: npm i playwright-core && npx playwright install --with-deps chromium
      - name: check layout
        run: |
          node scripts/check-layout.mjs --build \
            examples/01-start.md examples/02-writing.md examples/03-layout.md \
            examples/04-components.md examples/05-motion.md examples/06-theming.md \
            examples/pitch.md examples/seminar.md

  bench:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tracks that single-slide edit latency stays flat as decks grow.
      # Values are logged rather than asserted, since CI runners vary.
      - name: run benchmark
        run: cargo run --release -p mirzam-cli --bin mirzam-bench

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # build-wasm.sh installs the matching wasm-bindgen CLI itself.
      - name: build
        run: ./scripts/build-wasm.sh pkg
      - uses: actions/upload-artifact@v4
        with:
          name: mirzam-wasm
          path: pkg/
