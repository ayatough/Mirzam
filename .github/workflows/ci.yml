name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # Quality gates:
      #  - golden tests (catch output regressions)
      #  - CommonMark compatibility (extensions never break plain Markdown)
      #  - incremental build equivalence (incremental == full rebuild)
      - name: test
        run: cargo test --workspace

      - name: build sample decks
        run: |
          for deck in pitch showcase cookbook seminar media; do
            cargo run -q --bin mirzam -- build "examples/$deck.md" -o "/tmp/out-$deck"
          done

  layout:
    name: layout check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Renders each deck in a browser and fails on clipped or overlapping
      # content - the class of bug HTML snapshots cannot see.
      - name: install browser
        run: npm i playwright-core && npx playwright install --with-deps chromium
      - name: check layout
        run: |
          node scripts/check-layout.mjs --build \
            examples/pitch.md examples/showcase.md examples/cookbook.md \
            examples/seminar.md examples/media.md

  bench:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tracks that single-slide edit latency stays flat as decks grow.
      # Values are logged rather than asserted, since CI runners vary.
      - name: run benchmark
        run: cargo run --release -p mirzam-cli --bin mirzam-bench

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # build-wasm.sh installs the matching wasm-bindgen CLI itself.
      - name: build
        run: ./scripts/build-wasm.sh pkg
      - uses: actions/upload-artifact@v4
        with:
          name: mirzam-wasm
          path: pkg/
