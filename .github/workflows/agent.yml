name: Agent

# The loop that lets the author do nothing but review.
#
# Two things start an agent here, and both end in a pull request the author
# reads, comments on and merges - never in a push to `main`:
#
#   respond  the author wrote something: opened an issue, commented on one,
#            reviewed or commented on a pull request. The agent reads
#            the whole thread and acts on it.
#   build    the clock. Once a day the agent takes the next piece of work from
#            the backlog and opens a pull request for it - unless enough of its
#            pull requests are already waiting for the author.
#
# What the agent is told to do is not in this file: `.github/agent/respond.md`
# and `.github/agent/build.md` are the instructions, and `docs/agent-loop.md`
# is the description for a person.
#
# Only the repository owner starts `respond`. The repository is public, so
# anybody can comment, and a comment that starts an agent holding a write token
# and the owner's Claude subscription is not something to hand to anybody.

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    # 04:17 in Japan: the pull request is there in the morning, and the minute
    # is off the hour because the hour is when every schedule on GitHub fires.
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on (empty: take the next from the backlog)"
        required: false
        default: ""

# Each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether this event is one to act on, and wait before acting.
  #
  # The wait is the author's margin for error: a comment posted by mistake can
  # be edited or deleted for five minutes before anything reads it. Every new
  # event on the same thread cancels the wait in progress and starts its own,
  # so a burst of review comments is answered once, after the last of them -
  # and what the agent then reads is the thread as it stands, not the event
  # that woke it. A comment with a rocket in it skips the wait.
  #
  # Three kinds of event are passed over before any of that. A label other
  # than `agent:ready` is filing, not a request. A review with no summary is
  # either a bare approval or a carrier for inline comments, and those arrive
  # as events of their own. And a comment signed by a Claude Code session was
  # posted under the owner's account without being the owner speaking.
  # ---------------------------------------------------------------------------
  gate:
    name: wait for the thread to settle
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      github.event.sender.login == github.repository_owner &&
      (github.event_name != 'issues' || github.event.action != 'labeled' ||
       github.event.label.name == 'agent:ready') &&
      (github.event_name != 'pull_request_review' ||
       (github.event.review.body || '') != '') &&
      !contains(github.event.comment.body || github.event.review.body || '',
                'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: read
    concurrency:
      group: agent-wait-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      go: ${{ steps.thread.outputs.go }}
      kind: ${{ steps.thread.outputs.kind }}
      ref: ${{ steps.thread.outputs.ref }}
      number: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      # The body is tested in an expression and never reaches a shell: a
      # comment is text somebody typed, and text in a `run:` line is a command.
      - name: wait five minutes, unless the comment carries a rocket
        if: >-
          !contains(github.event.comment.body || github.event.review.body ||
                    github.event.issue.body || '', '🚀') &&
          !contains(github.event.comment.body || github.event.review.body ||
                    github.event.issue.body || '', ':rocket:')
        run: sleep 300

      - name: which thread, and is it the agent's to answer
        id: thread
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so there is no agent to wake. See docs/agent-loop.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_PR" != "true" ]; then
            { echo "kind=issue"; echo "ref="; echo "go=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                 --json state,headRefName,isCrossRepository)
          state=$(jq -r .state <<<"$pr")
          ref=$(jq -r .headRefName <<<"$pr")
          fork=$(jq -r .isCrossRepository <<<"$pr")
          # A pull request from a fork is somebody else's code, and answering it
          # means building that code on a machine that holds the token. Every
          # other open pull request is answered, whoever opened it: the owner
          # commenting should not have to know which branch names count. That
          # was tried - only `agent/` branches were answered - and the first
          # comment the owner ever left went unanswered.
          if [ "$state" != "OPEN" ] || [ "$fork" != "false" ]; then
            echo "::notice::#$NUMBER ($ref, $state) is closed or comes from a fork; leaving it alone."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "kind=pull request"; echo "ref=$ref"; echo "go=true"; } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The author said something. Read the thread and act on it.
  # ---------------------------------------------------------------------------
  respond:
    name: answer the author
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write # the Claude GitHub App's token is exchanged for this
    # One agent per thread at a time. Not cancelled by a newer one: a run that
    # is half way through a fix has to finish it, and the run queued behind
    # reads the thread afresh.
    concurrency:
      group: agent-thread-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's own branch, or `main` for an issue.
          ref: ${{ needs.gate.outputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install browser
        # Bounded and retried for the reason given in ci.yml: this is the step
        # where a runner hangs.
        run: |
          for attempt in 1 2 3; do
            if timeout -k 30s 5m bash -c 'npm i --no-save playwright-core && npx playwright-core install --with-deps chromium'; then
              chromium="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
              echo "MIRZAM_CHROMIUM=$chromium" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "attempt $attempt did not finish inside five minutes; retrying"
          done
          echo "the browser would not install in three attempts"
          exit 1
      # `pr-evidence.sh --pdf` rasterises an exported PDF's pages with it.
      - name: install the PDF rasteriser
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPOSITORY: ${{ github.repository }}
            OWNER: ${{ github.repository_owner }}
            THREAD: ${{ needs.gate.outputs.kind }} #${{ needs.gate.outputs.number }}

            The owner has written on this thread. Read AGENTS.md, then read
            .github/agent/respond.md and do what it says for this thread.
          claude_args: |
            --max-turns 300
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"

  # ---------------------------------------------------------------------------
  # The clock. Take the next piece of work and open a pull request for it.
  # ---------------------------------------------------------------------------
  build:
    name: take the next piece of work
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    concurrency:
      group: agent-build
      cancel-in-progress: false
    steps:
      # The author's reading time is what this loop runs out of first. An agent
      # that opens a pull request a day in front of somebody who reads two a
      # week has built a queue, not a product - so when enough are waiting, the
      # clock does nothing at all, and costs nothing.
      - name: is there room for another pull request
        id: room
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          LIMIT: ${{ vars.AGENT_MAX_OPEN_PRS || '3' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so there is no agent to start. See docs/agent-loop.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                   --json headRefName \
                   --jq '[.[] | select(.headRefName | startswith("agent/"))] | length')
          if [ "$open" -ge "$LIMIT" ]; then
            echo "::notice::$open agent pull request(s) are open and the limit is $LIMIT; not starting another."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.room.outputs.go == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.room.outputs.go == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.room.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.room.outputs.go == 'true'
        with:
          node-version: 20
      - name: install browser
        if: steps.room.outputs.go == 'true'
        run: |
          for attempt in 1 2 3; do
            if timeout -k 30s 5m bash -c 'npm i --no-save playwright-core && npx playwright-core install --with-deps chromium'; then
              chromium="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
              echo "MIRZAM_CHROMIUM=$chromium" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "attempt $attempt did not finish inside five minutes; retrying"
          done
          echo "the browser would not install in three attempts"
          exit 1
      # `pr-evidence.sh --pdf` rasterises an exported PDF's pages with it.
      - name: install the PDF rasteriser
        if: steps.room.outputs.go == 'true'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: anthropics/claude-code-action@v1
        if: steps.room.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPOSITORY: ${{ github.repository }}
            OWNER: ${{ github.repository_owner }}
            ISSUE TO WORK ON: ${{ inputs.issue || 'none named - take the next from the backlog' }}

            Read AGENTS.md, then read .github/agent/build.md and do what it
            says.
          claude_args: |
            --max-turns 400
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
