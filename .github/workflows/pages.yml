name: Pages

# Publishes two sites from one deployment, because GitHub Pages serves exactly
# one directory tree per repository:
#
#   /        the latest tag - what somebody arriving from a link should see
#   /next/   the tip of `main` - how a change gets looked at before it is
#            released, labelled as a working copy and asking not to be indexed
#
# The split exists because checking a change and publishing it used to be the
# same action. With no pull request in the way, `main` is where work lands, so
# tying the public face of the project to a tag is what keeps a half-finished
# afternoon off the front page.
#
# Triggered by CI finishing rather than by the push: the two ran in parallel on
# the same event, so a commit with a red test suite still reached the site.
#
# Publishing a release is the other trigger, and it is not optional. Cutting one
# means pushing the version bump and *then* tagging it, so the CI run for that
# commit finishes before the tag exists - and the root, which is built from the
# newest tag, gets rebuilt from the release before last. The first v0.2.0 deploy
# put v0.1.0 back on the front page exactly that way.
#
# `release: published` alone does not cover it. A release cut by dispatching the
# Release workflow is created by `gh` with `GITHUB_TOKEN`, and GitHub does not
# let an event raised by that token start another workflow - the loop guard that
# also stops Release restarting itself. So the release event never arrives, and
# v0.3.0 published with v0.2.0 still on the front page. Watching the Release
# workflow finish is what catches both routes: `workflow_run` fires on the run
# itself, not on the token that made the release inside it.
on:
  workflow_run:
    workflows: ["CI", "Release"]
    types: [completed]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Nothing that came from a push is published unless the run that produced it
    # passed. The other two triggers are the author saying so by hand - a
    # dispatch, or a release, whose commit CI already went green on before it
    # could be tagged.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # A healthy deploy takes two to four minutes. Without a limit a stalled one
    # holds the `pages` concurrency group - and with it every later deploy -
    # until GitHub's six-hour default gives up.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs the history and the tags, and the default
          # shallow clone has neither. Checking out the commit CI actually
          # tested, rather than whatever `main` points at now, keeps the site
          # and the green tick describing the same thing.
          #
          # Every other trigger takes the default branch, never `github.ref`:
          # on a `release` that ref is the tag, and checking it out would build
          # the preview from the release too - leaving /next/ claiming to be
          # `main` while showing something else entirely.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
      - run: git fetch --tags --force
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The themes gallery is generated by photographing the specimen slide in
      # every theme, which needs the same browser the layout check drives.
      # `build-site.sh` skips the gallery when they are missing and drops the
      # card from the landing page - correct for a laptop, wrong for the site
      # that is supposed to be the place the themes are shown.
      #
      # `playwright-core` is not a repository dependency (see AGENTS.md); it is
      # installed for the job.
      - name: install the browser
        # Bounded, and retried, because this step is where the runner hangs.
        # A Pages build sat twenty minutes inside `--with-deps` on 2026-08-19
        # while the identical step in CI finished in seventy-five seconds, and
        # with no limit anywhere it would have held the deploy for the six
        # hours GitHub allows a job by default. A hang is not a failure the
        # shell can see, so each attempt is given five minutes of its own and
        # the retry is what turns an infrastructure stall into a slow build
        # rather than a lost one. Both commands are idempotent, so an attempt
        # that got half way costs the next one nothing.
        run: |
          for attempt in 1 2 3; do
            if timeout -k 30s 5m bash -c 'npm i playwright-core && npx playwright install --with-deps chromium'; then
              exit 0
            fi
            echo "attempt $attempt did not finish inside five minutes; retrying"
          done
          echo "the browser would not install in three attempts"
          exit 1

      # The component gallery holds a `mermaid` fence, and the site is where the
      # drawn form is supposed to be shown: without `mmdc` here the published
      # gallery carries a code block instead. It brings its own Chromium, for
      # the reason CI's layout job gives. A tag built from before the fence
      # existed simply never asks for the renderer.
      - name: install the diagram renderer
        run: |
          npm i @mermaid-js/mermaid-cli
          echo "MIRZAM_MMDC=$PWD/node_modules/.bin/mmdc" >> "$GITHUB_ENV"

      - name: resolve version
        id: v
        run: |
          sha=$(git rev-parse --short HEAD)
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$tag" ]; then
            n=$(git rev-list --count "$tag..HEAD")
            echo "tag=$tag"            >> "$GITHUB_OUTPUT"
            echo "dev=$tag +$n · $sha" >> "$GITHUB_OUTPUT"
          else
            echo "tag="       >> "$GITHUB_OUTPUT"
            echo "dev=$sha"   >> "$GITHUB_OUTPUT"
          fi

      # Built from the tag's own tree, so the released site is the site that
      # was released - its decks, its docs, its build script. A tag predating
      # the two-channel split simply builds as it always did: it does not know
      # the channel variables and ignores them, which costs the root page its
      # version stamp until the next release and nothing else.
      - name: build the released site
        env:
          MIRZAM_SITE_CHANNEL: stable
          MIRZAM_SITE_VERSION: ${{ steps.v.outputs.tag }}
        run: |
          if [ -z "${{ steps.v.outputs.tag }}" ]; then
            echo "no tag yet; the root gets main instead"
            ./scripts/build-site.sh site
            exit 0
          fi
          git worktree add /tmp/released "${{ steps.v.outputs.tag }}"
          # The worktree is a clean checkout of the tag, so the browser
          # installed above is not in it. Copied rather than reinstalled: the
          # released build should photograph the released stylesheets, and a
          # second `npm i` in a different directory is the same bytes again.
          cp -R node_modules /tmp/released/ 2>/dev/null || true
          cd /tmp/released
          ./scripts/build-site.sh "$GITHUB_WORKSPACE/site"

      # `build-site.sh` clears its own output directory, so this has to come
      # second: the other order would take the released site down with it.
      - name: build the preview site
        if: steps.v.outputs.tag != ''
        env:
          MIRZAM_SITE_CHANNEL: dev
          MIRZAM_SITE_VERSION: ${{ steps.v.outputs.dev }}
        run: ./scripts/build-site.sh site/next

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Handing an artifact to Pages, and nothing else.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
