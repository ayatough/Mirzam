name: Release

# Publishes prebuilt `mirzam` binaries so using it does not require a Rust
# toolchain, and the VS Code extension so previewing a deck does not require
# building one.
#
# Two ways in, and the second exists because pushing a tag is not always
# available to whoever is cutting the release — a CI job, an agent, anyone
# working through credentials scoped to branches. Running this workflow with
# `publish` set makes the tag here, from the version already in the manifest,
# so the release needs no local git at all.
#
#   tag push `v*`              build, then publish
#   dispatch, publish = false  build only — rehearse the matrix, cut nothing
#   dispatch, publish = true   build, create the tag, publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag this commit and publish a release (otherwise build only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Pure-Rust dependency graph, so a cross linker is all this needs.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled from the arm64 runner rather than
          # built on `macos-13`: that image is retired, and a job requesting it
          # queues forever without ever failing, which would hold up every
          # release behind a runner that is not coming. Apple's SDK carries
          # both architectures, so the native linker handles this.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: build
        shell: bash
        env:
          # Cargo reads the linker from a target-specific variable whose name
          # is the target in SCREAMING_SNAKE_CASE. Empty for native builds,
          # where the default linker is the right one.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --bin mirzam --target ${{ matrix.target }}

      # One archive per target, named for the version it carries so a download
      # is self-identifying once it leaves the browser.
      - name: package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Every crate takes its version from `[workspace.package]`, whose
          # `version` is the first one in the root manifest.
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # scripts/install.sh builds the download URL from the tag, so a tag
          # that disagrees with the manifest publishes archives nobody can
          # install. Fail here rather than at the other end.
          case "$GITHUB_REF" in
            refs/tags/*)
              [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
                echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
                exit 1
              } ;;
          esac
          name="mirzam-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/mirzam.exe" ]; then
            cp "target/${{ matrix.target }}/release/mirzam.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/mirzam" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          # Checksums travel with the archive, so a download can be verified
          # without trusting the page it came from.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: smoke test
        # A binary that cannot build a deck is not a release. Skipped when
        # cross-compiled, where the artifact does not run on this machine.
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/mirzam"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" build examples/pitch.md -o "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}*
          if-no-files-found: error

      # The skill for claude.ai, the desktop app and phones, where nothing can
      # run a binary — so the archive has to arrive already built. Its contents
      # are the same on every platform, so one job makes it: the native Linux
      # build, which is the one whose binary actually runs here.
      - name: package the sandbox skill
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: target/${{ matrix.target }}/release/mirzam skill install --zip dist/skill/mirzam-writing-skill.zip

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: skill
          path: dist/skill/mirzam-writing-skill.zip
          if-no-files-found: error

  # The extension is the same package everywhere — a webview and a `.wasm`, no
  # native code — so it is built once rather than per target. It is not part of
  # the matrix above because it needs a different toolchain (the wasm32 target
  # and a version-matched `wasm-bindgen`) and none of the binaries.
  extension:
    name: vs code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # build-vsix.sh builds the WASM into media/ and installs the matching
      # wasm-bindgen CLI itself, so this is the same command a contributor runs.
      - name: package
        id: package
        run: |
          set -euo pipefail
          ./scripts/build-vsix.sh
          vsix=$(ls -t editors/vscode/*.vsix | head -1)
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      # The extension carries its own version, and the Marketplace refuses one
      # it has already seen — so a `package.json` left behind by a bump would
      # publish binaries under the new version and an extension under the old,
      # or fail at the Marketplace with the release already cut. This is the
      # same five-file check CI runs on `main`, run again where it is expensive
      # to be wrong.
      - name: every version agrees
        run: ./scripts/check-versions.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # On a tag push the tag is given; on a dispatch it is derived from the
      # manifest, which is the same rule the build job checked the tag against.
      - name: name this release
        id: rel
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            *) tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A release is not something to publish twice. Re-dispatching after a
      # failure part-way through should say so rather than move a tag people
      # may already have fetched.
      - name: refuse to republish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released. Bump the version, or delete the release first." >&2
            exit 1
          fi

      # The tag's section of the changelog becomes the release notes, so the
      # notes and the repository never disagree.
      - name: extract release notes
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          awk -v v="${tag#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for what changed in $tag." > notes.md
          fi

      # `gh release create` makes the tag when it does not exist, which is what
      # turns a dispatch into a release. It fires a `release` event rather than
      # a tag `push`, so this workflow does not start itself again.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.rel.outputs.tag }}' \
            --target "$GITHUB_SHA" \
            --title '${{ steps.rel.outputs.tag }}' \
            --notes-file notes.md \
            dist/*

  # The extension goes to two marketplaces: Microsoft's, which VS Code reads,
  # and Open VSX, which is where Cursor, VSCodium and Windsurf look. Neither is
  # reachable without a token, and both tokens are one-time human setup — see
  # the release checklist in docs/development.md.
  #
  # So each step is gated on its own secret rather than assumed. Before the
  # publisher exists this job runs, publishes nothing, and says so; the release
  # itself is already cut by then and does not depend on it. Adding a secret
  # later starts that marketplace with no other change.
  #
  # It runs after `publish` rather than beside it, because `publish` holds the
  # refuse-to-republish guard. A marketplace cannot take a version back, so
  # nothing should reach one until the release it belongs to exists.
  marketplace:
    name: publish the extension
    needs: [extension, publish]
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not available to an `if:`, so the tokens come
      # through `env`, which is. An unset secret is the empty string.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: name the package
        id: pkg
        run: echo "vsix=$(ls dist/*.vsix | head -1)" >> "$GITHUB_OUTPUT"

      # Publishing the artifact rather than rebuilding it: what reaches the
      # Marketplace is then byte-for-byte the file attached to the release, so
      # "the version I installed" and "the version I downloaded" cannot differ.
      # `vsce` reads VSCE_PAT from the environment.
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath '${{ steps.pkg.outputs.vsix }}'

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish '${{ steps.pkg.outputs.vsix }}' -p "$OVSX_PAT"

      # A skipped step is easy to miss in a green run, and "the release worked"
      # while the extension quietly went nowhere is exactly the thing to notice.
      - name: report what was skipped
        run: |
          [ -n "$VSCE_PAT" ] || echo "::warning::VSCE_PAT is not set - nothing was published to the VS Code Marketplace."
          [ -n "$OVSX_PAT" ] || echo "::warning::OVSX_PAT is not set - nothing was published to Open VSX."
